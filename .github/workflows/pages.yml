name: Deploy guest app to GitHub Pages

# Builds the React Recipes UI bundle as a static site and publishes it to
# GitHub Pages. The externally-hosted MFE guest routes (/embedding/*) are then
# reachable over trusted HTTPS at https://<owner>.github.io/multiframework-recipes/,
# which the <lightning-ui-embedding> hosts load from.
on:
  push:
    branches: [gitpage]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: force-app/main/react-recipes/uiBundles/reactRecipes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: force-app/main/react-recipes/uiBundles/reactRecipes/package-lock.json

      - name: Install dependencies
        run: npm ci

      # build:pages sets the router basename (VITE_PAGES_BASE), rewrites asset
      # URLs to be absolute under /multiframework-recipes/, and emits 404.html
      # as the SPA fallback (GitHub Pages has no server-side routing, so deep
      # links like /embedding/basic-embed must boot the SPA via 404.html).
      - name: Build
        run: npm run build:pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: force-app/main/react-recipes/uiBundles/reactRecipes/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
